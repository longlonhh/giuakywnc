services:
  postgres:
    image: postgres:16-alpine
    container_name: library-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_db
    ports:
      - '5432:5432'
    volumes:
      - library_pgdata:/var/lib/postgresql/data

volumes:
  library_pgdata:
